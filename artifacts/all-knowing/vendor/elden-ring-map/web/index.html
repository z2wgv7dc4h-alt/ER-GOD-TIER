<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elden Ring — Live Map</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗺️</text></svg>">
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <header id="brand">
      <h1>Elden Ring</h1>
      <span class="sub" data-i18n="app.subtitle">live map</span>
      <div id="lang-switch" class="lang-switch"></div>
      <button type="button" id="sb-collapse" class="sb-collapse" data-i18n-title="sb.collapse" title="Collapse sidebar">«</button>
    </header>

    <section id="character" class="panel" data-panel="character">
      <button type="button" class="panel-title" data-collapse>
        <span data-i18n="panel.character">Character</span><span class="chev">▾</span>
      </button>
      <div class="panel-body">
        <div class="char-head">
          <div>
            <div id="char-name" class="char-name">—</div>
            <div id="char-meta" class="dim char-meta" data-i18n="app.noSave">no save loaded</div>
          </div>
          <div id="live" class="live off" data-i18n-title="live.title">
            <span class="dot"></span><span id="live-text" data-i18n="live.off">offline</span>
          </div>
        </div>
        <div id="char-stats" class="stats"></div>
        <div id="char-where" class="where dim char-where"></div>
        <div class="save-picker">
          <label><span data-i18n="save.extension">Save type</span><select id="save-extension" class="save-extension"></select></label>
          <label><span data-i18n="save.character">Character</span><select id="save-character" class="save-character"></select></label>
        </div>
      </div>
    </section>

    <section class="panel" data-panel="progress">
      <button type="button" class="panel-title" data-collapse>
        <span data-i18n="panel.progress">Progress</span><span class="chev">▾</span>
      </button>
      <div class="panel-body">
        <div class="progress-head">
          <span data-i18n="progress.overall">Overall</span>
          <span id="progress-label" class="dim progress-label">0 / 0</span>
        </div>
        <div class="bar"><div id="progress-fill" class="fill progress-fill"></div></div>
      </div>
    </section>

    <section class="search-wrap panel" data-panel="search">
      <button type="button" class="panel-title" data-collapse>
        <span data-i18n="panel.search">Search</span><span class="chev">▾</span>
      </button>
      <div class="panel-body">
        <input id="search" class="marker-search" type="search" data-i18n-placeholder="search.placeholder"
               placeholder="Search markers…" autocomplete="off" spellcheck="false">
        <div id="search-results" class="search-results"></div>
      </div>
    </section>

    <section id="layers" class="panel tight" data-panel="map">
      <button type="button" class="panel-title" data-collapse>
        <span data-i18n="panel.map">Map</span><span class="chev">▾</span>
      </button>
      <div class="panel-body">
        <div id="layer-buttons" class="layer-buttons"></div>
      </div>
    </section>

    <section id="categories" class="panel tight grow" data-panel="categories">
      <div class="panel-title">
        <button type="button" class="panel-title-txt" data-collapse>
          <span data-i18n="panel.categories">Categories</span><span class="chev">▾</span>
        </button>
        <button type="button" id="toggle-all" class="mini toggle-all-btn" data-i18n="panel.selectNone">none</button>
      </div>
      <div class="panel-body" id="category-body">
        <div id="category-list" class="category-list"></div>
      </div>
    </section>

    <section class="panel tight" data-panel="options">
      <button type="button" class="panel-title" data-collapse>
        <span data-i18n="panel.options">Options</span><span class="chev">▾</span>
      </button>
      <div class="panel-body">
        <label class="row-check">
          <input type="checkbox" id="hide-found" data-option="hideFound">
          <span data-i18n="opt.hideFound">Hide found</span>
        </label>
        <label class="row-check">
          <input type="checkbox" id="show-labels" data-option="showLabels" checked>
          <span data-i18n="opt.showLabels">Show labels when zoomed</span>
        </label>
        <label class="row-check">
          <input type="checkbox" id="show-icons" data-option="showIcons" checked>
          <span data-i18n="opt.showIcons">Use the game's map icons</span>
        </label>
      </div>
    </section>

    <footer id="foot" class="dim"></footer>
  </aside>

  <main id="stage">
    <canvas id="map"></canvas>

    <button type="button" id="sb-expand" class="sb-expand" data-i18n-title="sb.expand" title="Expand sidebar" aria-hidden="true">»</button>

    <!-- All-Knowing: the sidebar (and the map-switcher inside it) is hidden
         in ?embed=1 mode. Without this, there is no way to reach Underground/
         Realm of Shadow/etc from the embedded map at all. buildLayerButtons()
         populates every ".layer-buttons" element, this one included. -->
    <div id="embed-layer-buttons" class="layer-buttons embed-layer-buttons"></div>

    <!-- All-Knowing: same problem, for the sidebar's category (grace/boss/
         item/...) filter checkboxes - the only way to hide a marker type is
         through #category-list, also hidden in embed mode. A collapsed-by-
         default toggle + panel, since the real list runs ~50 rows.
         buildCategories() populates every ".category-list" element. -->
    <button type="button" id="embed-cat-toggle" class="embed-cat-toggle" aria-expanded="false">Filters</button>
    <div id="embed-categories" class="embed-categories">
      <button type="button" id="embed-toggle-all" class="mini toggle-all-btn" data-i18n="panel.selectNone">none</button>
      <div id="embed-category-list" class="category-list"></div>
    </div>

    <!-- All-Knowing: the rest of the sidebar content is search, the save
         picker, the display options and the language switch - all hidden with
         #sidebar in ?embed=1. Each is a second copy carrying the same class
         (.marker-search / .search-results / .save-picker / [data-option] /
         .lang-switch / .char-*) so the existing builders and wiring populate
         every matching element, exactly like buildLayerButtons/buildCategories.
         Collapsed by default so it never covers the map until asked for. -->
    <button type="button" id="embed-tools-toggle" class="embed-tools-toggle" aria-expanded="false">Tools</button>
    <div id="embed-tools" class="embed-tools">
      <section class="embed-tool-section search-wrap">
        <input id="embed-search" class="marker-search" type="search" data-i18n-placeholder="search.placeholder"
               placeholder="Search markers…" autocomplete="off" spellcheck="false">
        <div id="embed-search-results" class="search-results"></div>
      </section>
      <section class="embed-tool-section">
        <div class="embed-tools-title" data-i18n="panel.character">Character</div>
        <div class="char-name">—</div>
        <div class="char-meta dim" data-i18n="app.noSave">no save loaded</div>
        <div class="char-where dim"></div>
        <div class="save-picker">
          <label><span data-i18n="save.extension">Save type</span><select id="embed-save-extension" class="save-extension"></select></label>
          <label><span data-i18n="save.character">Character</span><select id="embed-save-character" class="save-character"></select></label>
        </div>
      </section>
      <section class="embed-tool-section">
        <div class="embed-tools-title" data-i18n="panel.options">Options</div>
        <label class="row-check">
          <input type="checkbox" data-option="hideFound">
          <span data-i18n="opt.hideFound">Hide found</span>
        </label>
        <label class="row-check">
          <input type="checkbox" data-option="showLabels" checked>
          <span data-i18n="opt.showLabels">Show labels when zoomed</span>
        </label>
        <label class="row-check">
          <input type="checkbox" data-option="showIcons" checked>
          <span data-i18n="opt.showIcons">Use the game's map icons</span>
        </label>
      </section>
      <section class="embed-tool-section">
        <div class="embed-tools-title" data-i18n="progress.overall">Overall</div>
        <div class="progress-head">
          <span class="dim progress-label">0 / 0</span>
        </div>
        <div class="bar"><div class="fill progress-fill"></div></div>
      </section>
      <section class="embed-tool-section">
        <div class="lang-switch"></div>
      </section>
    </div>

    <div id="zoom-controls">
      <button type="button" id="zoom-in" data-i18n-title="zoom.in" title="Zoom in">+</button>
      <button type="button" id="zoom-out" data-i18n-title="zoom.out" title="Zoom out">−</button>
      <button type="button" id="zoom-fit" data-i18n-title="zoom.fit" title="Fit map">⤢</button>
      <button type="button" id="goto-player" data-i18n-title="zoom.player" title="Centre on last save">◎</button>
    </div>

    <div id="tooltip" class="hidden"></div>
    <div id="popup" class="hidden"></div>
    <div id="toasts"></div>
    <div id="hint" class="hint" data-i18n="hint.controls">drag to pan · scroll to zoom</div>
  </main>

</div>

<script src="js/i18n.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
